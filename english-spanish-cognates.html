<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPAN1001 · English–Spanish Cognates</title>
<style>
:root{--ink:#122b46;--blue:#1464dc;--red:#b42d46;--muted:#54677a;--line:#dce4ef;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:4px}button:disabled{opacity:.35;cursor:default}.app{max-width:1440px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:25px 5vw 18px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:14px;letter-spacing:.07em;color:var(--muted)}.brand{font-weight:800;color:var(--ink)}header button{border:1px solid var(--line);background:white;padding:10px 16px;border-radius:8px;color:var(--ink)}main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 0;min-height:0}.label{font-size:14px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);font-weight:bold;margin-bottom:15px}h1{font-size:clamp(32px,4.3vw,64px);line-height:1.12;margin:0 0 18px;letter-spacing:-.025em}p{font-size:clamp(19px,2vw,28px);line-height:1.45;margin:0 0 20px}.intro{max-width:940px}.hero h1{font-size:clamp(45px,6.8vw,96px);max-width:1000px}.hero .subtitle{font-size:clamp(25px,3vw,40px);color:var(--blue);margin:24px 0}.hero p{max-width:880px}.note{font-size:clamp(17px,1.65vw,24px);padding:15px 20px;border-left:4px solid var(--blue);background:#e8f0fd;margin-top:22px;line-height:1.4}.en{color:var(--blue)}.es{color:var(--red)}.arrow{color:#8596ab;font-weight:400;padding:0 .15em}table{border-collapse:collapse;width:100%;font-size:clamp(22px,2.65vw,38px);text-align:left}th{font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:500;padding:10px 22px 14px;border-bottom:2px solid var(--line)}td{padding:13px 22px;border-bottom:1px solid var(--line);width:50%}td:first-child{color:var(--blue)}td:last-child{color:var(--red)}td strong{font-weight:800}tr:last-child td{border-bottom:0}.compact{font-size:clamp(20px,2.2vw,31px)}.compact td{padding:10px 18px}.compact td:first-child{width:28%;font-size:.85em;color:var(--ink)}.columns{display:grid;grid-template-columns:1fr 1fr;gap:45px}.columns h2{font-size:clamp(23px,2.7vw,38px);margin:12px 0 18px}.columns table{font-size:clamp(20px,2.2vw,32px)}.columns td{padding:12px 6px}.reminder{border-bottom:1px solid var(--line);padding:17px 0}.reminder h2{font-size:clamp(22px,2.4vw,34px);margin:0 0 9px}.reminder p{margin:0;font-size:clamp(19px,1.8vw,26px)}footer{border-top:1px solid var(--line);padding-top:16px;display:flex;align-items:center;justify-content:space-between;gap:16px}.nav{display:flex;align-items:center;gap:12px}.nav button,.reveal{background:var(--ink);color:white;border:0;border-radius:8px;padding:12px 20px;font-weight:600}.nav button:first-child{background:white;color:var(--ink);border:1px solid var(--line)}select{max-width:270px;border:0;background:transparent;color:var(--ink);padding:10px 0;font-size:15px}.keys{font-size:13px;color:var(--muted)}.counter{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:55px;text-align:center}.track{position:fixed;top:0;left:0;width:100%;height:4px;background:var(--line)}.progress{height:100%;background:var(--blue);transition:width .15s}.answer{background:transparent;border:0;color:var(--red);font:inherit;min-width:160px;text-align:left;padding:0}.answer.hidden{color:var(--muted);font-size:.6em;border-bottom:2px dashed #9caec4;line-height:1.9}.practice td{padding:9px 22px}.practice-actions{display:flex;align-items:center;gap:20px;margin-top:16px}.practice-actions span{color:var(--muted);font-size:16px}.status{font-size:14px;color:var(--red)}@media(max-width:700px){.app{padding:22px 6vw 15px}main{padding:25px 0}.columns{grid-template-columns:1fr;gap:16px}.keys{display:none}footer{flex-wrap:wrap}select{max-width:220px}.nav{margin-left:auto}td{padding:12px 8px}.note{padding:12px}.compact td{padding:10px 4px}header{letter-spacing:0}.answer{min-width:110px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media print{header,footer,.track{display:none}body{background:white}.app{min-height:0}main{padding:0}}
</style></head><body><div class="track"><div class="progress" id="progress"></div></div><div class="app"><header><span class="brand">SPAN1001 <span style="font-weight:400">/ ENGLISH & SPANISH</span></span><button id="fullscreen" title="Enter fullscreen (F)">Full screen</button></header><main id="slide" aria-live="polite"></main><footer><div><label for="jump" class="keys">GO TO </label><select id="jump" aria-label="Choose slide"></select></div><span class="keys">← → Navigate · F Full screen</span><div class="nav"><button id="prev" aria-label="Previous slide">← Back</button><span class="counter" id="counter"></span><button id="next" aria-label="Next slide">Next →</button></div></footer><span id="status" class="status" role="status"></span></div>
<script>
const pattern=(title,desc,rows,note,enEnd='',esEnd='')=>({title,desc,rows,note,enEnd,esEnd});
const slides=[
{title:'English–Spanish Cognates',kind:'hero'},
pattern('Some words have the same spelling','Look at these English and Spanish words.',[['hotel','hotel'],['hospital','hospital'],['animal','animal'],['natural','natural'],['normal','normal']],'Many words ending in <b>-al</b> keep the same ending. Same spelling does not mean the same pronunciation!'),
pattern('-tion → -ción','Many English nouns ending in -tion have Spanish equivalents ending in -ción.',[['information','información'],['communication','comunicación'],['tradition','tradición'],['nation','nación']],'Remember the accent mark: <b>-ción</b>. Other letters may change too: <b>action → acción</b>.','tion','ción'),
pattern('-ity → -idad','Many English nouns ending in -ity have Spanish equivalents ending in -idad.',[['university','universidad'],['activity','actividad'],['nationality','nacionalidad'],['identity','identidad']],'Look at the whole word: other letters may change too.','ity','idad'),
pattern('-ic → -ico','Many English adjectives ending in -ic have Spanish equivalents ending in -ico.',[['basic','básico'],['public','público'],['artistic','artístico'],['fantastic','fantástico']],'Notice the accent marks in these examples.','ic','ico'),
pattern('-ous → -oso','Many English adjectives ending in -ous have Spanish equivalents ending in -oso.',[['curious','curioso'],['generous','generoso'],['delicious','delicioso'],['famous','famoso']],'The beginning of the word may change too.','ous','oso'),
pattern('-ct → -cto','Some English words ending in -ct have Spanish equivalents ending in -cto.',[['act','acto'],['conflict','conflicto'],['exact','exacto'],['correct','correcto']],'In these examples, simply add <b>-o</b>.','ct','cto'),
pattern('-ary → -ario','Some English nouns ending in -ary have Spanish equivalents ending in -ario.',[['diary','diario'],['vocabulary','vocabulario'],['salary','salario'],['commentary','comentario']],'This pattern does not work for every word ending in <b>-ary</b>.','ary','ario'),
pattern('-ist → -ista','Many English words ending in -ist have Spanish equivalents ending in -ista.',[['artist','artista'],['tourist','turista'],['dentist','dentista']],'These words often describe people or jobs.','ist','ista'),
{title:'More common endings',kind:'more'},
{title:'Letter patterns: ph and th',kind:'letters'},
{title:'Other spelling changes',kind:'other'},
{title:'Three things to remember',kind:'reminders'},
{title:'Your turn!',kind:'practice'}
];
const quiz=[['nation','nación'],['activity','actividad'],['fantastic','fantástico'],['generous','generoso'],['correct','correcto'],['artist','artista']];let answers=new Set();let current=0;
const end=(word,suffix)=>suffix&&word.endsWith(suffix)?word.slice(0,-suffix.length)+'<strong>'+suffix+'</strong>':word;
const table=(rows,a='',b='',cls='')=>`<table class="${cls}"><thead><tr><th scope="col">English</th><th scope="col">Spanish</th></tr></thead><tbody>${rows.map(r=>`<tr><td lang="en">${end(r[0],a)}</td><td lang="es">${end(r[1],b)}</td></tr>`).join('')}</tbody></table>`;
const title=t=>t.includes(' → ')?`<span class="en">${t.split(' → ')[0]}</span><span class="arrow"> → </span><span class="es">${t.split(' → ')[1]}</span>`:t;
function render(){const s=slides[current];let content='';let label=current>=9&&current<=11?'More patterns':current===13?'Pair practice':'Common spelling patterns';
if(s.kind==='hero')content=`<div class="hero"><div class="label">Spanish · Beginner level</div><h1>English–Spanish<br><span class="en">Cognates</span></h1><div class="subtitle">Common spelling patterns</div><p>Many English and Spanish words look similar and have similar meanings. These words can help you understand Spanish!</p><div class="note">These are <b>common patterns</b>, not rules for every word.</div></div>`;
else{content=`<div class="label">${label}</div><h1>${title(s.title)}</h1>`;
if(s.rows)content+=`<p class="intro">${s.desc}</p>${table(s.rows,s.enEnd,s.esEnd)}<div class="note">${s.note}</div>`;
if(s.kind==='more')content+=`<table class="compact"><thead><tr><th>Pattern</th><th>English</th><th>Spanish</th></tr></thead><tbody>${[['-ism → -ismo','tourism','turismo'],['-ism → -ismo','capitalism','capitalismo'],['-ance → -ancia','importance','importancia'],['-ance → -ancia','distance','distancia'],['-ence → -encia','difference','diferencia'],['-ence → -encia','experience','experiencia']].map(r=>`<tr><td>${r[0]}</td><td class="en">${r[1]}</td><td lang="es">${r[2]}</td></tr>`).join('')}</tbody></table>`;
if(s.kind==='letters')content+=`<p>In some related words:</p><div class="columns"><section><h2>${title('ph → f')}</h2>${table([['photo','foto'],['telephone','teléfono']])}</section><section><h2>${title('th → t')}</h2>${table([['theatre / theater','teatro'],['theme','tema']])}</section></div><div class="note">Check the rest of the word too!</div>`;
if(s.kind==='other')content+=`<div class="columns"><section><h2>An extra <span class="es">e-</span></h2><p>Some words beginning with <b>s + consonant</b> have an extra <b>e-</b> in Spanish.</p>${table([['student','estudiante'],['special','especial']])}</section><section><h2>Double → single</h2><p>Some double consonants become single consonants.</p>${table([['professor','profesor'],['different','diferente']])}</section></div><div class="note">Not all double consonants disappear: <b lang="es">acción</b>.</div>`;
if(s.kind==='reminders')content+=`<section class="reminder"><h2>1. Check the meaning.</h2><p>Spanish <b lang="es" class="es">éxito</b> means <b>success</b>, not <i>exit</i>.<br>English <b>exit</b> is <b lang="es" class="es">salida</b> in Spanish.</p></section><section class="reminder"><h2>2. Check the pronunciation.</h2><p>In Spanish <b lang="es" class="es">hotel</b>, the <b>h</b> is silent.</p></section><section class="reminder"><h2>3. Remember the accent marks.</h2><p lang="es" class="es">informaci<b>ó</b>n · b<b>á</b>sico · tel<b>é</b>fono</p></section>`;
if(s.kind==='practice')content+=`<p>Work with a partner. Can you guess the Spanish words?</p><table class="practice"><thead><tr><th>English</th><th>Spanish</th></tr></thead><tbody>${quiz.map((r,i)=>`<tr><td>${r[0]}</td><td><button class="answer ${answers.has(i)?'':'hidden'}" data-answer="${i}" aria-label="${answers.has(i)?'Hide':'Reveal'} answer for ${r[0]}" aria-pressed="${answers.has(i)}"><span lang="${answers.has(i)?'es':'en'}">${answers.has(i)?r[1]:'Reveal answer'}</span></button></td></tr>`).join('')}</tbody></table><div class="practice-actions"><button class="reveal" id="all">${answers.size===6?'Hide all':'Reveal all'}</button><span>Check your spelling and accent marks!</span></div>`;
}document.getElementById('slide').innerHTML=content;document.getElementById('counter').textContent=(current+1)+' / '+slides.length;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;document.getElementById('jump').value=current;document.getElementById('progress').style.width=((current+1)/slides.length*100)+'%';document.title=(current+1)+' · '+s.title+' | SPAN1001';}
function go(n){current=Math.max(0,Math.min(slides.length-1,n));history.replaceState(null,'','#'+(current+1));render();}
document.getElementById('jump').innerHTML=slides.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${s.title}</option>`).join('');
document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('jump').onchange=e=>go(Number(e.target.value));
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else document.getElementById('status').textContent='Use your browser’s full-screen menu.';}catch(e){document.getElementById('status').textContent='Use your browser’s full-screen menu.';}}
document.getElementById('fullscreen').onclick=fullscreen;document.addEventListener('fullscreenchange',()=>document.getElementById('fullscreen').textContent=document.fullscreenElement?'Exit full screen':'Full screen');
document.addEventListener('keydown',e=>{if(e.altKey||e.metaKey||e.ctrlKey||/SELECT|INPUT|TEXTAREA|BUTTON/.test(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1);}if(e.key==='Home'){e.preventDefault();go(0);}if(e.key==='End'){e.preventDefault();go(slides.length-1);}if(e.key.toLowerCase()==='f')fullscreen();});
document.getElementById('slide').onclick=e=>{const b=e.target.closest('[data-answer]');if(b){const i=Number(b.dataset.answer);answers.has(i)?answers.delete(i):answers.add(i);render();document.querySelector('[data-answer="'+i+'"]').focus();}if(e.target.id==='all'){answers=answers.size===6?new Set():new Set([0,1,2,3,4,5]);render();document.getElementById('all').focus();}};
function fromHash(){const n=Number(location.hash.slice(1));go(Number.isInteger(n)&&n>=1&&n<=slides.length?n-1:0);}window.addEventListener('hashchange',fromHash);fromHash();
</script></body></html>
