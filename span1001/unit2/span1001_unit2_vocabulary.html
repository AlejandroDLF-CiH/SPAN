<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPAN1001 · Unit 2 · Activities</title>
<style>
:root{--ink:#203833;--muted:#596d66;--green:#17644d;--mint:#e7f2ea;--paper:#f7f5ed;--border:#d9e2d9;--orange:#ad4b24;--blue:#285687;--red:#a13037}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select{font:inherit}button{cursor:pointer;border:1px solid var(--border);background:white;border-radius:12px;padding:12px 18px;color:var(--ink);transition:background .15s,transform .15s}button:hover:not(:disabled){background:var(--mint);transform:translateY(-1px)}button:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:3px}button:disabled{cursor:default;opacity:.5}button.primary{background:var(--green);color:white;border-color:var(--green)}button[aria-pressed=true],button.selected{background:var(--ink);color:white;border-color:var(--ink)}header,main,footer{max-width:1180px;margin:auto;padding:20px 28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:750}.small{font-size:.86rem;color:var(--muted)}.eyebrow{font-size:.82rem;text-transform:uppercase;letter-spacing:.12em;font-weight:750;color:var(--green)}nav{display:flex;gap:7px;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:0 28px 20px}nav button{padding:8px 13px;font-size:.88rem}h1{font-size:clamp(2rem,4.5vw,3.4rem);line-height:1.1;letter-spacing:-.035em;margin:12px 0 20px}h2{font-size:clamp(1.7rem,3vw,2.4rem);line-height:1.2;margin:7px 0 14px}h3{font-size:1.12rem;margin:0 0 12px}p{margin:10px 0 20px}.panel{background:white;border:1px solid var(--border);border-radius:22px;padding:clamp(20px,3vw,38px);min-height:460px;box-shadow:0 12px 40px #20383308}.intro{display:grid;grid-template-columns:1.2fr 1fr;gap:38px;align-items:center}.intro-list{display:grid;gap:10px}.intro-list div{background:var(--mint);padding:15px 20px;border-radius:12px}.intro-list b{color:var(--green);margin-right:12px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.actions{margin-top:25px;display:flex;gap:10px;flex-wrap:wrap}.counter{font-size:.86rem;font-weight:650;color:var(--muted)}.tag{padding:5px 12px;border-radius:100px;background:var(--mint);font-size:.82rem;color:var(--green)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.picture{font-size:clamp(6rem,16vw,10rem);text-align:center;line-height:1.3;background:#f1f5ef;border-radius:18px;padding:24px}.picture-row{display:grid;grid-template-columns:1fr 1.3fr;gap:32px;align-items:center}.answers{display:grid;gap:12px}.answers button{text-align:left;font-size:1.3rem}.feedback{min-height:36px;margin-top:20px;font-weight:650}.good{color:var(--green)}.bad{color:var(--red)}.choice.correct{border:2px solid var(--green);background:var(--mint)}.choice.incorrect{border:2px solid var(--red);background:#fff0ee}.match{display:grid;grid-template-columns:1fr 2fr;gap:24px}.verbs{display:flex;gap:10px;flex-direction:column}.verbs button{font-size:1.3rem}.endings{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ending{text-align:left;min-height:100px}.ending strong{display:block;font-size:1.2rem}.ending small{display:block;color:var(--muted);font-size:.84rem;margin-top:4px}.ending:disabled{opacity:1;background:var(--mint);border-color:#91b39e}.done{color:var(--green)}.question{font-size:clamp(1.6rem,4vw,2.5rem);padding:24px;background:#f3f5f0;border-radius:14px;margin:24px 0}.blank{display:inline-block;min-width:65px;border-bottom:3px solid var(--orange);text-align:center;color:var(--orange)}.tiles{display:flex;gap:10px;flex-wrap:wrap}.tiles button{font-size:1.3rem}.sentence{min-height:100px;border:2px dashed #a7b9ad;border-radius:16px;padding:18px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:22px 0}.sentence button{background:var(--mint)}.card{border:1px solid var(--border);border-radius:14px;padding:16px}.card b{display:block;color:var(--green);font-size:1.1rem}.card small{color:var(--muted)}.speaking{background:var(--mint);border-radius:16px;padding:22px;margin:22px 0}.speaking li{font-size:1.35rem;margin:10px 0}.pick{font-size:1rem;text-align:left;min-height:64px}.progress{height:5px;background:#e0e5da;max-width:1124px;margin:auto}.progress div{height:100%;background:var(--green);transition:width .2s}footer{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:15px}.hint{border-left:4px solid #d2a653;padding:10px 16px;background:#fff8e7}.empty{color:var(--muted)}[hidden]{display:none!important}@media(max-width:720px){header,main,footer{padding:16px}nav{padding:0 16px 14px}.intro,.picture-row,.match{grid-template-columns:1fr}.grid,.endings{grid-template-columns:1fr 1fr}.verbs{flex-direction:row;flex-wrap:wrap}.verbs button{font-size:1.05rem;padding:8px 13px}.picture{font-size:6rem;padding:10px}.panel{min-height:430px}.answers button{font-size:1.1rem}header{align-items:start}.header-sub{max-width:140px;text-align:right}.intro{gap:20px}}@media(max-width:420px){.grid,.endings{grid-template-columns:1fr}.panel{padding:18px}footer{display:block}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div><div class="brand">SPAN1001 <span style="color:var(--green)">/ Unit 2</span></div><div class="small">The University of Hong Kong · Spanish Programme</div></div><div class="small header-sub">Vocabulary practice<br>Free time & language learning</div></header>
<nav aria-label="Activities" id="nav"></nav><div class="progress" aria-hidden="true"><div id="progress"></div></div>
<main><section class="panel" id="app" aria-labelledby="title"></section></main>
<footer><span>By Doctor Song Yang Alejandro</span><span>Lecturer in Spanish and Global and Area Studies</span></footer>
<noscript>Please enable JavaScript to use the activities.</noscript>
<script>
'use strict';
const vocab=[
['ir a','un concierto','go to a concert'],['ir a','un museo','go to a museum'],['ir a','una exposición','go to an exhibition'],['ir a','la playa','go to the beach'],['ir al','cine','go to the cinema'],['ir al','teatro','go to the theatre'],
['ir de','compras','go shopping'],['ir de','excursión','go on an excursion'],['salir a','cenar','go out for dinner'],['salir a','bailar','go out dancing'],['salir de','noche','go out at night'],['salir con','amigos/as','go out with friends'],['salir con','mis compañeros/as','go out with my classmates'],
['hacer','un curso de teatro','take a drama course'],['hacer','un intercambio con un/a nativo/a','do a language exchange with a native speaker'],['hacer','ejercicios de gramática','do grammar exercises'],['hacer','fotos','take photos'],
['ver','la televisión','watch television'],['ver','una serie','watch a series'],['ver','una película','watch a film'],['escuchar','música','listen to music'],['escuchar','la radio','listen to the radio'],['escuchar','un pódcast','listen to a podcast'],
['leer','el periódico','read the newspaper'],['leer','una revista','read a magazine'],['leer','un libro','read a book'],['escribir','un mensaje','write a message'],['escribir','un texto','write a text'],['escribir','un diario','write a diary'],
['hablar','un idioma','speak a language'],['hablar','español','speak Spanish'],['hablar con','nativos/as','talk to native speakers'],['hablar con','hispanohablantes','talk to Spanish speakers'],
['visitar','páginas web','visit websites'],['visitar','lugares históricos','visit historic places'],['visitar','a la familia','visit family'],['visitar','a los/as amigos/as','visit friends'],
['practicar','la pronunciación','practise pronunciation'],['practicar','español','practise Spanish'],['jugar a','videojuegos','play video games'],['jugar al','fútbol','play football'],['jugar al','tenis','play tennis'],['aprender','un idioma','learn a language'],['aprender','idiomas','learn languages'],['aprender','inglés','learn English'],['aprender a','bailar','learn to dance'],['aprender a','tocar la guitarra','learn to play the guitar']
];
const phrase=i=>vocab[i][0]+' '+vocab[i][1];
const names=['Start','1 · Pictures','2 · Match','3 · Prepositions','4 · Word order','5 · My choices','Word bank','60-second challenge'];
const pic=[['🏖️','A beach',3,[3,6,4]],['📸','A camera taking a photo',16,[16,23,20]],['🎧🎵','Headphones and music',20,[20,25,9]],['⚽','A football',40,[40,41,39]],['📖','An open book',25,[25,21,16]],['🛒🛍️','Shopping bags and a shopping trolley',6,[6,7,8]],['🎸','A guitar',46,[46,45,13]],['🎾','A tennis ball and racket',41,[41,40,7]]];
const prep=[
['ir','compras','de','Use “ir de compras” for “go shopping”.'],['ir','un museo','a','Use “ir a” before a destination.'],['salir','cenar','a','Use “salir a” + an activity in the infinitive.'],['salir','noche','de','“Salir de noche” means “go out at night”.'],['salir','amigos','con','“Con” means “with”.'],['hablar','español','—','Use “hablar español” to say “speak Spanish”.'],['hablar','nativos','con','Use “hablar con” to say “talk to someone”.'],['aprender','inglés','—','Use “aprender” + a language.'],['aprender','bailar','a','Use “aprender a” + an activity in the infinitive.'],['ir','cine','al','a + el = al: ir al cine.'],['jugar','fútbol','al','a + el = al: jugar al fútbol.'],['ir','la playa','a','“A la” stays as two words.'],['visitar','la familia','a','Use the personal “a” here: visitar a la familia.'],['escuchar','música','—','“Escuchar” takes no preposition here.'],['hacer','fotos','—','Use “hacer fotos” to say “take photos”.'],['ir','excursión','de','Use “ir de excursión” for “go on an excursion”.'],['jugar','tenis','al','a + el = al: jugar al tenis.'],['aprender','tocar la guitarra','a','Use “aprender a” + an activity in the infinitive.']
];
const ordering=[20,16,15,13,46,32,34,14,4,41,37,28];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const el=id=>document.getElementById(id);const app=el('app');let stage=0;let timer=null;
const state={pic:0,picAnswers:{},prep:0,prepAnswers:{},matchRound:0,matchSelected:null,matched:new Set(),matchOrder:shuffle(vocab.map((_,i)=>i)),order:0,orderWords:{},orderChosen:{},orderStatus:{},choices:new Set(),bank:0,challenge:null};
function button(text,fn,cls=''){const b=document.createElement('button');b.type='button';b.textContent=text;if(cls)b.className=cls;b.onclick=fn;return b;}
function feedback(text,good=true){el('feedback').textContent=text;el('feedback').className='feedback '+(good?'good':'bad');}
function shell(eyebrow,title,instruction){app.innerHTML='<div class="eyebrow">'+eyebrow+'</div><h2 id="title">'+title+'</h2><p>'+instruction+'</p><div id="content"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="actions" id="actions"></div>';}
function move(s){clearInterval(timer);timer=null;if(state.challenge?.running)state.challenge.running=false;stage=s;render();window.scrollTo({top:0,behavior:'auto'});el('title').tabIndex=-1;el('title').focus({preventScroll:true});}
function navigation(){el('nav').replaceChildren();names.forEach((n,i)=>{const b=button(n,()=>move(i));b.setAttribute('aria-pressed',i===stage);if(i===stage)b.setAttribute('aria-current','step');el('nav').append(b);});el('progress').style.width=(stage<=5?(stage/5*100):100)+'%';}
function pager(index,total,change,nextStage){const a=el('actions');const b=button('← Previous',()=>change(index-1));b.disabled=index===0;a.append(b);const info=document.createElement('span');info.className='tag';info.textContent=(index+1)+' / '+total;a.append(info);a.append(button(index<total-1?'Next →':'Next activity →',()=>index<total-1?change(index+1):move(nextStage),'primary'));}
function render(){navigation();[intro,pictures,matching,prepositions,wordOrder,myChoices,bank,challenge][stage]();}
function intro(){app.innerHTML='<div class="intro"><div><div class="eyebrow">Activities · Vocabulary lab</div><h1 id="title">What do you<br>want to do?</h1><p>Learn useful Spanish phrases for your free time and your language class.</p><p class="small">Start with pictures. Build phrases. Then talk to a partner. Use the menu to choose any activity.</p><div id="start"></div></div><div class="intro-list"><div><b>01</b> Choose a phrase for each picture.</div><div><b>02</b> Match verbs and endings.</div><div><b>03</b> Choose the missing preposition.</div><div><b>04</b> Put the words in order.</div><div><b>05</b> Choose three activities and speak.</div></div></div>';el('start').append(button('Start practising →',()=>move(1),'primary'));}
function pictures(){const i=state.pic,q=pic[i];shell('01 / Picture practice','What’s the activity?','Look at the picture. Choose the correct Spanish phrase.');el('content').innerHTML='<div class="picture-row"><div class="picture" role="img" aria-label="'+q[1]+'">'+q[0]+'</div><div class="answers" id="options"></div></div>';q[3].forEach(id=>{const b=button(phrase(id),()=>{state.picAnswers[i]={selected:id,revealed:false};pictures();},'choice');b.lang='es';if(state.picAnswers[i]?.selected===id)b.classList.add(id===q[2]?'correct':'incorrect');el('options').append(b);});const a=state.picAnswers[i];if(a){if(a.revealed)feedback('Answer: '+phrase(q[2]));else feedback(a.selected===q[2]?'Correct! '+phrase(q[2]):'Try again. Look at the picture carefully.',a.selected===q[2]);}el('actions').append(button('Show answer',()=>{state.picAnswers[i]={selected:q[2],revealed:true};pictures();}));pager(i,pic.length,j=>{state.pic=j;pictures();},2);}
function matching(){const ids=state.matchOrder.slice(state.matchRound*6,state.matchRound*6+6);shell('02 / Phrase builder','Build a phrase','Click a verb on the left, then click an ending. Use the English meaning as your guide. You can use a verb more than once.');el('content').innerHTML='<div class="match"><div class="verbs" id="verbs"></div><div class="endings" id="endings"></div></div>';const verbs=[...new Set(ids.map(i=>vocab[i][0]))].sort();verbs.forEach(v=>{const b=button(v,()=>{state.matchSelected=v;matching();});b.lang='es';b.setAttribute('aria-pressed',state.matchSelected===v);el('verbs').append(b);});ids.forEach(id=>{const q=vocab[id],done=state.matched.has(id),b=button('',()=>{if(!state.matchSelected){feedback('First, choose a verb on the left.',false);return;}if(state.matchSelected===q[0]){state.matched.add(id);matching();feedback('Correct! '+phrase(id));}else feedback('Try again. Match the English meaning on this card.',false);},'ending');b.innerHTML='<strong lang="es">'+(done?'✓ '+phrase(id):'… '+q[1])+'</strong><small>'+q[2]+'</small>';b.disabled=done;el('endings').append(b);});const n=ids.filter(i=>state.matched.has(i)).length;feedback(n+' / '+ids.length+' phrases completed in this round.');el('actions').append(button('Try again',()=>{ids.forEach(id=>state.matched.delete(id));state.matchSelected=null;matching();}),button('Show answers',()=>{ids.forEach(id=>state.matched.add(id));matching();feedback('Answers shown. Read the complete phrases aloud.');}));pager(state.matchRound,Math.ceil(vocab.length/6),j=>{state.matchRound=j;state.matchSelected=null;matching();},3);}
function prepositions(){const i=state.prep,q=prep[i];shell('03 / Small words, useful patterns','Choose the missing word','Choose a, de, con or al. Choose “No preposition” when nothing is needed.');el('content').innerHTML='<div class="question" lang="es">'+q[0]+' <span class="blank" id="gap">…</span> '+q[1]+'</div><div class="tiles" id="options"></div>';['a','de','con','al','—'].forEach(v=>{const b=button(v==='—'?'No preposition':v,()=>{state.prepAnswers[i]={value:v,revealed:false};prepositions();},'choice');const a=state.prepAnswers[i];if(a?.value===v)b.classList.add(v===q[2]?'correct':'incorrect');el('options').append(b);});const a=state.prepAnswers[i];if(a){const correct=a.value===q[2];if(correct)el('gap').textContent=q[2]==='—'?'':q[2];feedback(correct?(a.revealed?'Answer: ':'Correct! ')+q[3]:'Try again. Think about the whole phrase.',correct);}el('actions').append(button('Show answer',()=>{state.prepAnswers[i]={value:q[2],revealed:true};prepositions();}));pager(i,prep.length,j=>{state.prep=j;prepositions();},4);}
function wordOrder(){const i=state.order,id=ordering[i],target=phrase(id);if(!state.orderWords[i]){state.orderWords[i]=shuffle(target.split(' '));state.orderChosen[i]=[];}const words=state.orderWords[i],chosen=state.orderChosen[i];shell('04 / Word order','Put the words in order','Click the words to build the Spanish phrase. Click a word in your answer to remove it.');el('content').innerHTML='<div class="hint">'+vocab[id][2]+'</div><div class="sentence" id="sentence" lang="es" aria-label="Your answer"></div><div class="tiles" id="tiles" lang="es"></div>';if(!chosen.length)el('sentence').innerHTML='<span class="empty" lang="en">Your phrase will appear here.</span>';chosen.forEach((token,position)=>el('sentence').append(button(words[token],()=>{chosen.splice(position,1);delete state.orderStatus[i];wordOrder();})));words.forEach((word,j)=>{const b=button(word,()=>{chosen.push(j);delete state.orderStatus[i];wordOrder();});b.disabled=chosen.includes(j);el('tiles').append(b);});if(state.orderStatus[i])feedback(state.orderStatus[i].text,state.orderStatus[i].good);el('actions').append(button('Check answer',()=>{const actual=chosen.map(j=>words[j]).join(' ');const ok=actual===target;state.orderStatus[i]={good:ok,text:ok?'Correct! '+target:'Not quite. Check the word order and try again.'};wordOrder();},'primary'),button('Try again',()=>{state.orderChosen[i]=[];delete state.orderStatus[i];wordOrder();}),button('Show answer',()=>{const used=new Set();state.orderChosen[i]=target.split(' ').map(w=>{const j=words.findIndex((t,k)=>t===w&&!used.has(k));used.add(j);return j;});state.orderStatus[i]={good:true,text:'Answer shown. Read the phrase aloud.'};wordOrder();}));pager(i,ordering.length,j=>{state.order=j;wordOrder();},5);}
function natural(i){return phrase(i).replace('amigos/as','amigos').replace('compañeros/as','compañeros').replace('un/a nativo/a','un nativo').replace('nativos/as','nativos').replace('los/as','los');}
function myChoices(){shell('05 / Your turn','What do you want to do?','Choose three activities. Read your sentences aloud. Then ask a partner. There are no wrong answers.');el('content').innerHTML='<div class="speaking"><div class="small">QUIERO + INFINITIVE = I WANT TO…</div><div id="sentences"></div><hr style="border:0;border-top:1px solid #bcd0be;margin:20px 0"><div lang="es"><b>A:</b> ¿Qué quieres hacer?<br><b>B:</b> Quiero… ¿Y tú?</div></div><div class="grid" id="picks"></div>';if(!state.choices.size)el('sentences').innerHTML='<p lang="es" style="font-size:1.5rem">Quiero…</p>';else{const ul=document.createElement('ul');ul.lang='es';state.choices.forEach(id=>{const li=document.createElement('li');li.textContent='Quiero '+natural(id)+'.';ul.append(li);});el('sentences').append(ul);}vocab.forEach((q,i)=>{const b=button(phrase(i),()=>{if(state.choices.has(i))state.choices.delete(i);else if(state.choices.size<3)state.choices.add(i);else{feedback('You have three activities. Click one to remove it before choosing another.',false);return;}myChoices();},'pick');b.lang='es';b.title=q[2];b.setAttribute('aria-pressed',state.choices.has(i));el('picks').append(b);});feedback(state.choices.size+' / 3 activities selected.');el('actions').append(button('Clear choices',()=>{state.choices.clear();myChoices();}),button('Review the word bank',()=>move(6)),button('Try the 60-second challenge',()=>move(7),'primary'));}
function bank(){shell('Reference / All phrases','Word bank','Read the Spanish phrases and their English meanings. Use the buttons to turn the pages.');const ids=vocab.map((_,i)=>i).slice(state.bank*8,state.bank*8+8);el('content').innerHTML='<div class="grid two" id="cards"></div>';ids.forEach(i=>{const d=document.createElement('div');d.className='card';d.innerHTML='<b lang="es">'+phrase(i)+'</b><small>'+vocab[i][2]+'</small>';el('cards').append(d);});el('content').insertAdjacentHTML('beforeend','<p class="hint small" style="margin-top:20px"><b>Remember:</b> a + el = al. Examples: <span lang="es">ir al cine; jugar al fútbol.</span><br>The slash shows alternatives: <span lang="es">amigos/as = amigos or amigas.</span></p>');const prev=button('← Previous',()=>{state.bank--;bank();});prev.disabled=state.bank===0;const next=button('Next →',()=>{state.bank++;bank();},'primary');next.disabled=(state.bank+1)*8>=vocab.length;el('actions').append(prev,document.createTextNode('Page '+(state.bank+1)+' / '+Math.ceil(vocab.length/8)),next);}
function challenge(){const c=state.challenge;shell('Optional / Quick review','60-second challenge','Choose the Spanish phrase that matches the English meaning. One point for each correct answer.');if(!c||!c.running){if(c){el('content').innerHTML='<div class="question">'+c.score+' correct / '+c.attempts+' answered</div><p>'+ (c.attempts?'Review the phrases, then try again.':'Ready when you are.')+'</p>';}else el('content').innerHTML='<p class="hint">This activity is optional. The other activities have no time limit.</p>';el('actions').append(button(c?'Play again':'Start 60 seconds',startChallenge,'primary'),button('Word bank',()=>move(6)));return;}el('content').innerHTML='<div class="row between"><span class="tag" id="clock"></span><span class="tag" id="score"></span></div><div class="question" id="meaning"></div><div class="answers" id="challengeOptions"></div>';paintChallenge();}
function startChallenge(){clearInterval(timer);state.challenge={running:true,score:0,attempts:0,deadline:Date.now()+60000,deck:shuffle(vocab.map((_,i)=>i)),position:0,locked:false,last:''};challenge();timer=setInterval(()=>{const c=state.challenge;if(!c||!c.running)return;if(Date.now()>=c.deadline){clearInterval(timer);timer=null;c.running=false;challenge();}else el('clock').textContent=Math.ceil((c.deadline-Date.now())/1000)+' seconds left';},200);}
function paintChallenge(){const c=state.challenge;if(!c.running)return;el('clock').textContent=Math.max(0,Math.ceil((c.deadline-Date.now())/1000))+' seconds left';el('score').textContent=c.score+' correct / '+c.attempts+' answered';const id=c.deck[c.position%c.deck.length];el('meaning').textContent=vocab[id][2];el('challengeOptions').replaceChildren();const other=shuffle(vocab.map((_,i)=>i).filter(i=>i!==id)).slice(0,2);shuffle([id,...other]).forEach(x=>{const b=button(phrase(x),()=>{if(c.locked||!c.running||Date.now()>=c.deadline)return;c.locked=true;c.attempts++;if(x===id)c.score++;feedback(x===id?'Correct!':'Answer: '+phrase(id),x===id);el('challengeOptions').querySelectorAll('button').forEach(b=>b.disabled=true);el('score').textContent=c.score+' correct / '+c.attempts+' answered';el('actions').replaceChildren(button('Next phrase →',()=>{c.position++;c.locked=false;el('actions').replaceChildren();feedback('');paintChallenge();},'primary'));},'choice');b.lang='es';el('challengeOptions').append(b);});}
render();
</script>
</body></html>
